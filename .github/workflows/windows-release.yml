name: Build release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Read application version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Could not read the version from Cargo.toml" }
          "APP_VERSION=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build optimized executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\a-simple-autoclicker.exe dist\portable
          Copy-Item README.md, LICENSE dist\portable
          Compress-Archive -Path dist\portable\* -DestinationPath dist\A-Simple-Autoclicker-Windows-x64.zip

      - name: Install installer builder
        run: choco install innosetup --yes --no-progress

      - name: Create Setup executable
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - name: Upload downloadable builds
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            dist/A-Simple-Autoclicker-Windows-x64.zip
            dist/A-Simple-Autoclicker-Setup-*-x64.exe
          if-no-files-found: error

  linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libadwaita-1-dev \
            libgtk-4-dev \
            libx11-dev \
            libxtst-dev \
            pkg-config

      - name: Test
        run: cargo test

      - name: Build Debian package
        run: ./scripts/build-deb.sh

      - name: Upload Debian package
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-amd64
          path: dist/a-simple-autoclicker_*_amd64.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - windows
      - linux
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Check tag matches application version
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n 1)"
          test "${GITHUB_REF_NAME}" = "v${version}"

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Publish tagged GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            dist/*.zip
            dist/*.exe
            dist/*.deb
