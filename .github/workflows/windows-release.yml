name: Build Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Read application version
        shell: pwsh
        run: |
          $match = Select-String -Path Cargo.toml -Pattern '^version = "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw "Could not read the version from Cargo.toml" }
          "APP_VERSION=$($match.Matches[0].Groups[1].Value)" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Test
        run: cargo test --target x86_64-pc-windows-msvc

      - name: Build optimized executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Create portable ZIP
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\portable | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\a-simple-autoclicker.exe dist\portable
          Copy-Item README.md, LICENSE dist\portable
          Compress-Archive -Path dist\portable\* -DestinationPath dist\A-Simple-Autoclicker-Windows-x64.zip

      - name: Install installer builder
        run: choco install innosetup --yes --no-progress

      - name: Create Setup executable
        shell: pwsh
        run: '& "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\windows\installer.iss'

      - name: Upload downloadable builds
        uses: actions/upload-artifact@v4
        with:
          name: A-Simple-Autoclicker-Windows-x64
          path: |
            dist/A-Simple-Autoclicker-Windows-x64.zip
            dist/A-Simple-Autoclicker-Setup-*-x64.exe
          if-no-files-found: error

      - name: Publish tagged GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $portable = Resolve-Path dist\A-Simple-Autoclicker-Windows-x64.zip
          $installer = Get-ChildItem dist\A-Simple-Autoclicker-Setup-*-x64.exe | Select-Object -First 1
          if (-not $installer) { throw "The Setup executable was not created" }
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $portable $installer.FullName --clobber --repo "${{ github.repository }}"
          } else {
            gh release create $tag $portable $installer.FullName --generate-notes --repo "${{ github.repository }}"
          }
