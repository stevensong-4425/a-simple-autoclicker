[package]
name = "a-simple-autoclicker"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
description = "A simple X11-first GTK4/libadwaita autoclicker"
license = "MIT"

[dependencies]
adw = { package = "libadwaita", version = "0.6", features = ["v1_4"] }
dbus = { version = "0.9", features = ["vendored"] }
gtk = { package = "gtk4", version = "0.8", features = ["v4_10"] }
libloading = "0.8"
ksni = "=0.2.2"
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"

[build-dependencies]
# ksni 0.2 uses D-Bus code generation at build time. Enable the same vendored
# native library in Cargo's separate build-dependency graph.
dbus = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
strip = true
