[package]
name = "a-simple-autoclicker"
version = "0.1.16"
edition = "2021"
rust-version = "1.88"
description = "A simple cross-platform desktop autoclicker"
license = "MIT"

[dependencies]
serde = { version = "=1.0.217", features = ["derive"] }
serde_json = "=1.0.138"

[target.'cfg(target_os = "linux")'.dependencies]
adw = { package = "libadwaita", version = "0.6", features = ["v1_4"] }
dbus = { version = "0.9", features = ["vendored"] }
gtk = { package = "gtk4", version = "0.8", features = ["v4_10"] }
libloading = "0.8"
ksni = "=0.2.2"

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "=0.27.2", default-features = false, features = ["default_fonts", "glow"] }
# Enabling common-controls-v6 hard-imports TaskDialogIndirect even though this
# app has no About menu, preventing startup when ComCtl32 v6 is not activated.
tray-icon = { version = "=0.14.3", default-features = false }
windows-sys = { version = "=0.59.0", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.build-dependencies]
# ksni 0.2 uses D-Bus code generation at build time. Enable the same vendored
# native library in Cargo's separate build-dependency graph.
dbus = { version = "0.9", features = ["vendored"] }

[profile.release]
lto = "thin"
strip = true
